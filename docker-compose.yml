# ==============================================================================
# Pranav R Portfolio — Production Docker Compose Orchestration
# Reverse Proxy Architecture: Client -> Nginx (SSL & Security) -> Next.js (App)
# ==============================================================================

services:
  # --- Next.js Full-Stack Application ---
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pranavr-nextjs
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.local
    expose:
      - "3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- Hardened Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: pranavr-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount custom Nginx configurations
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Mount SSL certificates (create directory ./nginx/ssl and place fullchain.pem & privkey.pem)
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Let's Encrypt Certbot challenge directory
      - ./nginx/certbot-www:/var/www/certbot:ro
    depends_on:
      nextjs:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
