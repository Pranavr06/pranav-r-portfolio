# ==============================================================================
# Pranav R Portfolio — Production Nginx Configuration
# High-Performance Reverse Proxy with Hardened Security Architecture
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # --- MIME Types ---
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Security: Information Disclosure Prevention ---
    server_tokens off; # Hides Nginx version number from response headers & error pages

    # --- Performance Tuning ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # --- DoS & Slowloris Attack Mitigation: Buffer & Timeout Constraints ---
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_max_body_size 15M; # Maximum upload size for certificates/documents

    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # --- Logging Setup ---
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_ext;
    error_log /var/log/nginx/error.log warn;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --- Rate Limiting Zones (Leaky Bucket Algorithm) ---
    # 1. General browsing traffic limit: 20 requests/second per IP
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;

    # 2. Strict API rate limit: 5 requests/second per IP for dynamic API routes
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    # 3. Critical Auth rate limit: 2 requests/second per IP for login/auth routes
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    # 4. Connection limit: Maximum 25 simultaneous connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Custom rate-limit response code (429 Too Many Requests)
    limit_req_status 429;
    limit_conn_status 429;

    # --- WebSocket Upgrade Map ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Upstream: Next.js Production Application ---
    upstream nextjs_upstream {
        # When using Docker Compose, "nextjs" is the service hostname.
        # When running on bare metal/VPS, change to "127.0.0.1:3000".
        server nextjs:3000;
        keepalive 64;
    }

    # --- Include Virtual Host Server Configurations ---
    include /etc/nginx/conf.d/*.conf;
}
