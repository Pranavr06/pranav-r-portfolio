# ==============================================================================
# Pranav R Portfolio — Standard Reverse Proxy Parameters
# Forwards authentic client identity, headers, and enables WebSocket support
# ==============================================================================

# HTTP Version 1.1 for keepalive and WebSocket support
proxy_http_version 1.1;

# Forward real client IP and request details to Next.js
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# WebSocket Support (Next.js Fast Refresh, Server Actions, Live Streaming)
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Timeouts & Proxy Buffering
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

proxy_buffering on;
proxy_buffers 16 16k;
proxy_buffer_size 16k;
proxy_busy_buffers_size 32k;
proxy_temp_file_write_size 32k;
