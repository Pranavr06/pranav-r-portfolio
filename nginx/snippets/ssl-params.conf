# ==============================================================================
# Pranav R Portfolio — Modern SSL/TLS Parameters
# Hardened TLS configuration based on Mozilla Modern SSL recommendations
# ==============================================================================

# Protocols: Only modern, secure TLS versions (Disable insecure SSLv2, SSLv3, TLSv1.0, TLSv1.1)
ssl_protocols TLSv1.2 TLSv1.3;

# Cipher Suites: Modern, strong forward secrecy ciphers (ECDHE)
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

# Session Caching & Optimization (Improves HTTPS performance)
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# Diffie-Hellman Parameter for DHE ciphersuites (generated via openssl dhparam -out dhparam.pem 2048)
# ssl_dhparam /etc/nginx/ssl/dhparam.pem;

# OCSP Stapling: Fast certificate revocation checking
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 1.0.0.1 8.8.4.4 valid=300s;
resolver_timeout 5s;
