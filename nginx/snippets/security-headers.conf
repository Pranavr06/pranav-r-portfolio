# ==============================================================================
# Pranav R Portfolio — Nginx Security Headers Snippet
# Modern HTTP Security Headers for defense-in-depth against XSS, Clickjacking,
# MIME-sniffing, and protocol downgrade attacks.
# ==============================================================================

# Prevent Clickjacking by restricting framing
add_header X-Frame-Options "DENY" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable XSS filtering in legacy browsers
add_header X-XSS-Protection "1; mode=block" always;

# Control referrer information sent in HTTP requests
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict sensitive browser features and APIs
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=(), payment=()" always;

# Enforce HTTPS with HTTP Strict Transport Security (HSTS)
# 2 years duration, include subdomains, eligible for browser preloading
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Content Security Policy (CSP)
add_header Content-Security-Policy "default-src 'self' https: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' blob: data: https:; font-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
