# ==============================================================================
# Pranav R Portfolio — Virtual Host Configuration (Reverse Proxy + SSL)
# Handles HTTP to HTTPS redirection, SSL termination, caching, & Next.js proxying
# ==============================================================================

# --- HTTP (Port 80): Automatic Redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name pranavr.in www.pranavr.in localhost;

    # Allow Let's Encrypt ACME challenges without redirection
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS permanently
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (Port 443): Secure Reverse Proxy ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pranavr.in www.pranavr.in localhost;

    # --- SSL Certificates ---
    # Update these paths to match your Let's Encrypt or custom SSL certificates
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # --- Security & Hardening Snippets ---
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/block-exploits.conf;

    # Strip backend tech stack disclosure headers
    proxy_hide_header X-Powered-By;

    # Global connection limit per IP
    limit_conn conn_limit 25;

    # ==============================================================================
    # CACHING & STATIC ASSET DELIVERY
    # Next.js static builds are content-hashed; cache aggressively to reduce server load
    # ==============================================================================

    # Next.js immutable static build assets
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public portfolio media assets (images, cutouts, icons, documents)
    location /assets/ {
        proxy_pass http://nextjs_upstream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Search engine & AI bot index files
    location ~* ^/(favicon\.ico|icon\.png|robots\.txt|sitemap\.xml|llms\.txt)$ {
        proxy_pass http://nextjs_upstream;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ==============================================================================
    # HIGH-RISK & RATE-LIMITED ENDPOINTS
    # Prevent brute-force attacks and abuse on forms and authentication routes
    # ==============================================================================

    # Admin Login: Strict brute-force rate limit (2 req/s with burst of 5)
    location = /admin/login {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://nextjs_upstream;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Public API Endpoints: Rate limited to 5 req/s with burst of 10
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://nextjs_upstream;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ==============================================================================
    # MAIN APPLICATION ROUTE
    # Reverse proxy all web pages to Next.js with WebSockets, streaming, & full headers
    # ==============================================================================
    location / {
        limit_req zone=general_limit burst=30 nodelay;

        proxy_pass http://nextjs_upstream;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}
